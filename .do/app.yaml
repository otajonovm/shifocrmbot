# DigitalOcean App Platform spec
# Apps → Create / Edit → App Spec yoki GitHub repo bilan avtomatik o'qiladi

name: shifocrmbot
region: fra

services:
  - name: web
    github:
      repo: otajonovm/shifocrmbot
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 8080
    run_command: npm start
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: TELEGRAM_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_SERVICE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: BOT_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: PUBLIC_APP_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: TELEGRAM_USE_WEBHOOK
        scope: RUN_TIME
        value: "true"
      - key: TELEGRAM_POLLING_ENABLED
        scope: RUN_TIME
        value: "false"
      - key: TELEGRAM_WEBHOOK_SECRET
        scope: RUN_TIME
        type: SECRET
